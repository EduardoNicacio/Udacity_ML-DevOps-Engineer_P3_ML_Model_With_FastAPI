services:
  - type: web
    name: census-salary-api
    env: python
    autoDeploy: true
    autoDeployTrigger: checksPass
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
